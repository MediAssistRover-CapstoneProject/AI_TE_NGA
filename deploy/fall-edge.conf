# Include in the TLS media vhost once the private media worker is reachable.
# Substitute MEDIA_PRIVATE_IP with the media instance private IPv4 address.
location = /v1/fall/frame {
    client_max_body_size 256k;
    client_body_buffer_size 256k;
    proxy_request_buffering off;
    proxy_buffering off;
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 2s;
    proxy_read_timeout 4s;
    proxy_pass http://MEDIA_PRIVATE_IP:7895;
}
