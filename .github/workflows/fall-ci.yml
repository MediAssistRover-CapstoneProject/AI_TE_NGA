name: Fall inference CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-fall-service.txt
      - name: Install production dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-fall-service.txt 'httpx>=0.27,<1'
      - name: Check fall logic and authenticated inference
        run: |
          bash -n deploy/install-fall.sh
          python -B test_fall_detector.py
          python -B - <<'PY'
          import io
          import os
          from datetime import datetime, timezone
          from uuid import uuid4
          from fastapi.testclient import TestClient
          from PIL import Image
          from fall_service import app

          token = 'local-ci-only-token-0123456789abcdef'
          os.environ['FALL_API_TOKEN'] = token
          headers = {'Authorization': 'Bearer ' + token, 'Content-Type': 'image/jpeg',
                     'X-Fall-Session': str(uuid4()),
                     'X-Fall-Captured-At': datetime.now(timezone.utc).isoformat(),
                     'X-Fall-Camera-Moving': 'false'}
          image = io.BytesIO()
          Image.new('RGB', (640, 480)).save(image, 'JPEG')
          with TestClient(app) as client:
              assert client.get('/health').json()['state'] == 'READY'
              assert client.post('/v1/fall/frame', content=image.getvalue()).status_code == 401
              headers['X-Fall-Captured-At'] = datetime.now(timezone.utc).isoformat()
              assert client.post('/v1/fall/frame', content=b'bad JPEG', headers=headers).status_code == 422
              headers['X-Fall-Captured-At'] = datetime.now(timezone.utc).isoformat()
              response = client.post('/v1/fall/frame', content=image.getvalue(), headers=headers)
              assert response.status_code == 200 and response.json()['suspected_fall'] is False
              assert response.json()['overlay']['detections'] == []
              assert response.json()['overlay']['captured_at'] is not None
              assert response.headers['cache-control'] == 'no-store'
          PY

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FALL_DEPLOY_ROLE_ARN != ''
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: mar-fall-media-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      ARTIFACT_BUCKET: ${{ vars.FALL_ARTIFACT_BUCKET }}
      MEDIA_INSTANCE: ${{ vars.FALL_MEDIA_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ vars.FALL_DEPLOY_ROLE_ARN }}
      - name: Deploy verified fall inference to media EC2
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $MEDIA_INSTANCE =~ ^i-[0-9a-f]+$ && $ARTIFACT_BUCKET =~ ^[a-z0-9][a-z0-9.-]+$ ]]
          artifact=$(mktemp)
          trap 'rm -f -- "$artifact"' EXIT
          tar --exclude='__pycache__' -czf "$artifact" fall_service.py fall_detector.py yolov8n-pose.onnx requirements-fall-service.txt deploy/install-fall.sh deploy/fall-ai.service
          checksum=$(sha256sum "$artifact" | cut -d' ' -f1)
          key="s3://$ARTIFACT_BUCKET/ai-fall/releases/$GITHUB_SHA.tar.gz"
          aws s3 cp "$artifact" "$key" --only-show-errors
          url=$(aws s3 presign "$key" --expires-in 900)
          echo "::add-mask::$url"
          command=$(cat <<SCRIPT
          set -eu
          stage=\$(mktemp -d /var/tmp/mar-fall-ci.XXXXXX)
          trap 'rm -rf -- "\$stage"' EXIT
          curl -fsS --proto '=https' --max-time 90 -o "\$stage/release.tgz" '$url'
          printf '%s  %s\n' '$checksum' "\$stage/release.tgz" | sha256sum -c -
          tar -xzf "\$stage/release.tgz" -C "\$stage"
          bash "\$stage/deploy/install-fall.sh" '$GITHUB_SHA'
          SCRIPT
          )
          params=$(jq -cn --arg command "$command" '{commands:[$command],executionTimeout:["900"]}')
          id=$(aws ssm send-command --instance-ids "$MEDIA_INSTANCE" --document-name AWS-RunShellScript --comment "MAR Fall AI $GITHUB_SHA" --parameters "$params" --query Command.CommandId --output text)
          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$MEDIA_INSTANCE" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) echo "Fall inference release ready ($GITHUB_SHA)"; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) echo "SSM deploy $status ($id)" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo "SSM deploy is still pending ($id)" >&2
          exit 1
